name: Linux build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normal build and tests
        run: make test
      - name: ASan and UBSan build and tests
        if: success() || failure()
        run: make test-asan
